<!DOCTYPE html>
<html>

<head>
    <title> Task Focus Mode</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="focus-container">

        <p class="focus-label">FOCUS MODE</p>

        <!-- Show the task the user chose to work on. -->
        <h1>{{ task.title }}</h1>

        <!-- Use this task's individual duration for the timer. -->
        <div id="timer" class="focus-timer" data-duration="{{ task.duration }}"
            data-remaining="{{ task.remaining_time }}">
            00:00
        </div>

        <p class="focus-status">
            Status: <span id="status">{{ task.status }}</span>
        </p>

        <!-- Show the number of interruptions during this task. -->
        <p class="focus-interruptions">
            Interruptions: <span id="interruptionCount">0</span>
        </p>

        <!-- Show the total time spent away from Focus Mode. -->
        <p class="focus-interruption-time">
            Interruption Time: <span id="interruptionTime">0 seconds</span>
        </p>
        <div class="focus-actions">

            <button id="startButton" type="button">Start</button>

            <button id="pauseButton" type="button">Pause</button>

            <form method="POST" action="{{ url_for('complete_task', task_id=task.id) }}">
                <button id="endButton" type="submit">Complete Task</button>
            </form>

        </div>

        <a class="tasks-link" href="{{ url_for('view_tasks') }}">
            View My Tasks
        </a>

        <a class="sessions-link" href="{{ url_for('view_sessions') }}">
            &lt;- Back to My Sessions
        </a>

    </main>


    <script>

        // Get the timer element from the page.
        const timer = document.getElementById("timer");

        // Get any saved remaining time from the database.
        let savedTime = Number(timer.dataset.remaining);

        // If there is saved time, continue from there.
        // Otherwise, start with this task's full duration.
        let timeLeft = savedTime > 0
            ? savedTime
            : Number(timer.dataset.duration) * 60;

        // Store the timer interval.
        let timerInterval = null;

        // Get the buttons and status text.
        const startButton = document.getElementById("startButton");
        const pauseButton = document.getElementById("pauseButton");
        const status = document.getElementById("status");
        const endButton = document.getElementById("endButton");

        // Store the ID of the current interruption record.
        let currentInterruptionId = null;


        // Update the timer display.
        function updateTimer() {

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timer.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }


        // Start the task timer.
        function startTimer() {

            // Do not start another timer if one is already running.
            if (timerInterval !== null) {
                return;
            }

            // Do not start the timer if there is no time left.
            if (timeLeft <= 0) {
                return;
            }

            // Update the task status.
            status.textContent = "ongoing";

            // Start counting down every second.
            timerInterval = setInterval(function () {

                if (timeLeft > 0) {

                    // Remove one second from the remaining time.
                    timeLeft--;

                    // Update the timer display.
                    updateTimer();

                } else {

                    // Stop the timer.
                    clearInterval(timerInterval);
                    timerInterval = null;

                    // Automatically complete the task.
                    fetch("{{ url_for('complete_task', task_id=task.id) }}", {
                        method: "POST"
                    }).then(function () {

                        // Return to My Tasks after completing the task.
                        window.location.href = "{{ url_for('view_tasks') }}";

                    });
                }

            }, 1000);
        }


        // Start the task when the Start button is clicked.
        startButton.addEventListener("click", function () {

            startTimer();

        });


        // Pause the task timer.
        pauseButton.addEventListener("click", function () {

            // Only pause if the timer is currently running.
            if (timerInterval === null) {
                return;
            }

            // Stop the timer.
            clearInterval(timerInterval);
            timerInterval = null;

            // Create form data to send the remaining time.
            const formData = new FormData();

            // Save the remaining seconds.
            formData.append("remaining_time", timeLeft);

            // Send the remaining time to the server.
            fetch("{{ url_for('pause_task', task_id=task.id) }}", {
                method: "POST",
                body: formData
            });

            // Update the status on the page.
            status.textContent = "paused";

        });


        // Complete the task manually.
        endButton.addEventListener("click", function () {

            // Stop the timer.
            clearInterval(timerInterval);
            timerInterval = null;

            // Update the status on the page.
            status.textContent = "completed";

        });


        // Show the correct starting time when the page loads.
        updateTimer();


        // Get the interruption information from the database.
        fetch("{{ url_for('get_interruptions', task_id=task.id) }}")
            .then(function (response) {
                return response.json();
            })
            .then(function (data) {

                // Show the number of interruptions.
                document.getElementById("interruptionCount").textContent =
                    data.count;

                // Show the total interruption time.
                document.getElementById("interruptionTime").textContent =
                    data.total_seconds + " seconds";

            });


        // Detect when the user leaves or returns to the Focus Mode page.
        document.addEventListener("visibilitychange", function () {

            // --------------------------------------------------
            // USER LEAVES FOCUS MODE
            // --------------------------------------------------

            if (document.hidden && timerInterval !== null) {

                // Stop the timer while the user is away.
                clearInterval(timerInterval);
                timerInterval = null;

                // Start an interruption record.
                fetch("{{ url_for('start_interruption', task_id=task.id) }}", {
                    method: "POST"
                })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {

                        // Save the interruption ID.
                        currentInterruptionId = data.interruption_id;

                    });

            }


            // --------------------------------------------------
            // USER RETURNS TO FOCUS MODE
            // --------------------------------------------------

            if (!document.hidden && currentInterruptionId !== null) {

                // End the interruption record.
                fetch(
                    "{{ url_for('end_interruption', task_id=task.id, record_id=0) }}"
                        .replace(
                            "/0/end",
                            "/" + currentInterruptionId + "/end"
                        ),
                    {
                        method: "POST"
                    }
                )
                    .then(function () {

                        // Clear the current interruption ID.
                        currentInterruptionId = null;

                        // Update the interruption information.
                        return fetch(
                            "{{ url_for('get_interruptions', task_id=task.id) }}"
                        );

                    })
                    .then(function (response) {
                        return response.json();
                    })
                    .then(function (data) {

                        // Update the interruption count.
                        document.getElementById("interruptionCount").textContent =
                            data.count;

                        // Update the total interruption time.
                        document.getElementById("interruptionTime").textContent =
                            data.total_seconds + " seconds";

                    });


                // Continue the timer after the user returns.
                startTimer();

            }

        });

    </script>


</body>

</html>
