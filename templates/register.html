<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mindlock - Sign Up 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Fredoka', sans-serif; } </style>
</head>
<body class="bg-pink-50 flex items-center justify-center min-h-screen text-gray-700">

    <div class="bg-white p-8 rounded-3xl shadow-sm border border-pink-100 w-96 text-center">
        <h1 class="text-3xl font-bold text-pink-400 mb-2">Create Account 🌸</h1>
        <p class="text-xs text-gray-400 mb-6">Join Mindlock to start locking in focus sessions!</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-pink-100 border border-pink-300 text-pink-700 px-4 py-2 rounded-xl mb-4 text-sm">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register" class="space-y-4">
            <div>
                <input type="text" name="username" placeholder="Username" required 
                       class="w-full px-4 py-3 rounded-2xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm">
            </div>
            <div>
                <input type="email" name="email" placeholder="Email Address" required 
                       class="w-full px-4 py-3 rounded-2xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm">
            </div>
            <div>
                <input type="password" name="password" placeholder="Create Password" required 
                       class="w-full px-4 py-3 rounded-2xl border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 text-sm">
            </div>
            <button type="submit" class="w-full bg-pink-400 hover:bg-pink-500 text-white font-bold py-3 rounded-2xl transition shadow-md">
                Sign Up ✨
            </button>
        </form>

        <p class="text-xs text-gray-400 mt-6">
            Already have an account? <a href="{{ url_for('login') }}" class="text-pink-500 font-bold hover:underline">Log in here</a>
        </p>
    </div>

</body>
</html>
