<!DOCTYPE html>
<html>

<head>
    <title>Create Study Session</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Page heading -->
    <h1>Create a Study Session</h1>


    <!-- Form for creating a new study session -->
    <form method="POST">

        <!-- Label for the session title -->
        <label for="title">Session Title:</label>

        <!-- Input where the user enters the session title -->
        <input type="text" id="title" name="title" required>

        <br><br>

        <!-- Label for the session duration -->
        <label for="duration">Session Duration:</label>

        <!-- Dropdown where the user chooses how long to study -->
        <select id="duration" name="duration" required>
            <option value="15">15 minutes</option>
            <option value="30" selected>30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60">60 minutes</option>
            <option value="90">90 minutes</option>
            <option value="120">120 minutes</option>
        </select>

        <br><br>

        <!-- Button to submit the form -->
        <button type="submit">Create Session</button>

    </form>

</body>

</html>
