<!DOCTYPE html>
<html>

<head>
    <title>Focus Mode</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="focus-container">

        <p class="focus-label">FOCUS MODE</p>

        <h1>{{ session.title }}</h1>

        <div id="timer" class="focus-timer" data-duration="{{ session.duration }}"
            data-remaining="{{ session.remaining_time }}">
            30:00
        </div>

        <p class="focus-status">
            Status: <span id="status">{{ session.status }}</span>
        </p>

        <div class="focus-actions">

            <button id="startButton" type="button">Start</button>

            <button id="pauseButton" type="button">Pause</button>

            <button id="endButton" type="button">End Session</button>

        </div>

        <a class="tasks-link" href="{{ url_for('view_tasks') }}">
            View My Tasks
        </a>

    </main>

    <script>

        const timer = document.getElementById("timer");
        let savedTime = Number(timer.dataset.remaining);
        let timeLeft = savedTime > 0 ? savedTime : Number(timer.dataset.duration) * 60;
        let timerInterval = null;

        const startButton = document.getElementById("startButton");
        const pauseButton = document.getElementById("pauseButton");
        const status = document.getElementById("status");
        const endButton = document.getElementById("endButton");

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            timer.textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        startButton.addEventListener("click", function () {
            if (timerInterval !== null) {
                return;
            }

            fetch("{{ url_for('start_session', session_id=session.id) }}", {
                method: "POST"
            });

            status.textContent = "active";

            timerInterval = setInterval(function () {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimer();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);
        });

        pauseButton.addEventListener("click", function () {
            clearInterval(timerInterval);
            timerInterval = null;

            const formData = new FormData();
            formData.append("remaining_time", timeLeft);

            fetch("{{ url_for('pause_session', session_id=session.id) }}", {
                method: "POST",
                body: formData
            });

            status.textContent = "paused";
        });

        endButton.addEventListener("click", function () {
            clearInterval(timerInterval);
            timerInterval = null;

            fetch("{{ url_for('end_session', session_id=session.id) }}", {
                method: "POST"
            });

            status.textContent = "completed";
        });

        updateTimer();

    </script>

</body>

</html>
